# Các nơi phục vụ chỉ mục cập nhật.
#
# Updater thử lần lượt theo thứ tự dưới đây và dừng ở chỗ trả lời được.
# Thứ tự KHÔNG quan trọng về mặt bảo mật: mọi bản sao đều phải có chữ ký
# đúng của khoá mà binary ghim sẵn, nên kẻ chiếm được mirror nào thì cũng
# không tạo ra được bản cập nhật giả. Thứ tự chỉ quyết định *ai được hỏi
# trước*, tức là tốc độ và sẵn có.
#
# URL phải là https:// và trỏ tới đúng một tệp chỉ mục. Chữ ký được suy ra
# bằng cách thêm ".sig".
#
# Thứ tự này đổi một lần vì lý do cụ thể: Netlify hết hạn mức tài khoản
# miễn phí nên nó vẫn trả 200 cho /latest.json — nhưng là bản cũ đóng băng từ
# lúc đó, và người dùng cứ tưởng mình đã cập nhật. Một mirror đứng yên im lặng
# còn tệ hơn không có mirror. GitHub Pages không giới hạn, phục vụ thẳng
# từ kho camareLOL-mirror, và không có bước build nào có thể hỏng giữa chừng.

mirrors = [
  # Mirror chính: GitHub Pages, phục vụ trực tiếp từ nhánh main của kho
  # camareLOL-mirror. Không build, không giới hạn băng thông, không hết hạn.
  "https://tamkogay9876-code.github.io/camareLOL-mirror/latest.json",

  # GitHub Releases: chập hơn CDN nhưng gần như không bao giờ mất. Đây cũng
  # là nơi bản gốc của mọi thứ, nên nó là dự phòng hợp lý.
  "https://github.com/tamkogay9876-code/camareLOL/releases/latest/download/latest.json",

  # Netlify: vẫn phục vụ, nhưng đã hết hạn mức nên đóng băng. Giữ ở cuối
  # danh sách để không mất liên kết với nó; nó không còn là nguồn cập nhật.
  # https://camarelol.netlify.app/latest.json

  # Thêm URL mới chỉ cần sửa file này rồi build lại — không phải sửa mã nguồn.
  #
  # KHÔNG thêm dịch vụ không phải để phục vụ tệp tĩnh:
  #   - caddyserver.com là trang chủ đạt của dự án máy chủ web Caddy, không
  #     phải nơi lưu trữ miễn phí
  #   - PyPI là kho gói Python; đẩy binary Rust vào đó là lạm dụng dịch vụ
  #   - một URL phục vụ HTML thay vì tệp sẽ trả 200 với một trang lỗi, và
  #     updater sẽ báo "chữ ký sai" thay vì "mirror chết" — cần kiểm kiểu
  #     nội dung, không chỉ mã trạng thái
]