name: Update mirror site

# Publishes lol/site to the lol-site branch, which any static host can serve:
# Netlify, Vercel, Cloudflare Pages and GitHub Pages all read a branch.
#
# Nothing here is secret and nothing here decides trust. The signing key lives
# in the camareLOL binary; this workflow only copies files that are already
# signed, after checking that they really are.

on:
  # A new release is the only thing that should change the mirror.
  release:
    types: [published]
  # Plus a daily refresh, so a release made by some other path still lands.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync the index from the newest release
        run: |
          python -m py_compile lol/lol_sync.py lol/lol_server.py
          # Fails the job if the index is not signed by the key this repo
          # pins. An unsigned release must not reach a mirror.
          python lol/lol_sync.py --out site

      - name: Refuse to publish an unsigned or stale mirror
        run: |
          set -euo pipefail
          test -s site/latest.json
          test -s site/latest.json.sig
          version="$(python -c 'import json;print(json.load(open("site/latest.json"))["version"])')"
          echo "mirror holds v$version"
          if [ "${version}" = "0.0.0" ]; then
            echo "::error::the mirror resolved to version 0.0.0"
            exit 1
          fi

      - name: Publish to the lol-site branch
        run: |
          set -euo pipefail
          # Orphans carry no history that matters here — the site is two
          # files that are replaced wholesale — and this keeps the branch
          # readable instead of thousands of commits deep.
          git config user.name "camareLOL bot"
          git config user.email "bot@users.noreply.github.com"

          branch="lol-site"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Start the branch from the current tree if it does not exist yet.
          if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null 2>&1; then
            git fetch "$remote" "$branch"
            worktree="$(mktemp -d)"
            git worktree add -f "$worktree" "refs/remotes/origin/$branch"
            target="$worktree"
          else
            target="$(mktemp -d)"
            git worktree add -f "$target" -b "$branch" HEAD
          fi

          mkdir -p "$target"
          # Remove whatever the previous run left: a stale extra file would
          # still be served.
          find "$target" -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp site/latest.json site/latest.json.sig "$target/"

          cp .github/lol-site-README.md "$target/README.md"
          ( cd "$target" && git add -A && git commit -m "mirror: v$version" )
          ( cd "$target" && git push "$remote" "HEAD:$branch" )

          echo "published the lol-site branch; point your static host at it"