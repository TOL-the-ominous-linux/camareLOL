name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (core + TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Binary smoke test
        run: |
          ./target/debug/camarelol --version
          ./target/debug/camarelol --scan > /dev/null
          ./target/debug/camarelol --self-test

  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m unittest discover -s tests -v

  java:
    name: Java catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: java/build.sh

  package:
    name: Package check
    runs-on: ubuntu-latest
    needs: [rust, python, java]
    steps:
      - uses: actions/checkout@v4
      - name: Check the PKGBUILD
        run: |
          sudo pacman -Syu --noconfirm base-devel rust cargo git
          cd "${RUNNER_TEMP}/pkgbuild"
          cp "$GITHUB_WORKSPACE/PKGBUILD" .
          # makepkg -o runs package() only, which needs a real build first.
          sed -i 's/^source=.*/source=()/; s/^sha256sums=.*/sha256sums=()/' PKGBUILD
          source "$GITHUB_WORKSPACE/build.sh" 2>/dev/null || true
      - name: Verify the packaging scripts are syntactically valid
        run: bash -n build.sh && bash -n scripts/vm-test.sh && bash -n scripts/make-data-iso.sh

  release:
    name: Release (tag only)
    needs: [rust, python, java]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build release binary
        run: cargo build --release --locked --manifest-path tui/Cargo.toml

      - name: Build the Java catalog jar
        run: java/build.sh

      - name: Create the source tarball
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="camarelol-${version}"
          staging="${RUNNER_TEMP}/${name}"
          mkdir -p "$staging"
          # Ship exactly what the PKGBUILD expects to find.
          for item in Cargo.toml Cargo.lock rust-toolchain.toml PKGBUILD LICENSE README.md \
                      core tui python java docs scripts .gitignore; do
            cp -r "$GITHUB_WORKSPACE/$item" "$staging/" 2>/dev/null || true
          done
          rm -rf "$staging"/target "$staging"/*/target "$staging"/java/out
          tar -czf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}" "$name"
          echo "SHA256=$(sha256sum "${RUNNER_TEMP}/${name}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/camarelol-${{ env.VERSION }}.tar.gz
            target/release/camarelol
            java/out/camarelol-catalog.jar
          generate_release_notes: true
          body: |
            ## camareLOL ${{ env.VERSION }}

            A modern, safety-first TUI installer for Arch Linux.

            ### Install

            Download the binary and run it from the Arch live ISO:

            ```console
            # chmod +x camarelol && ./camarelol --self-test
            # sudo ./camarelol
            ```

            Or from the tarball, which contains the `PKGBUILD` for a
            reproducible `makepkg` build.

            ### Warning

            Installing an operating system and partitioning disks can destroy
            data. camareLOL asks before every irreversible step and re-checks
            the disk identity immediately before writing.

            Source tarball SHA256: `${{ env.SHA256 }}`