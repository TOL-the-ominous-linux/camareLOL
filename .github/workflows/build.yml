name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (core + TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Binary smoke test
        run: |
          ./target/debug/camarelol --version
          ./target/debug/camarelol --scan > /dev/null
          ./target/debug/camarelol --self-test

  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m unittest discover -s tests -v

  java:
    name: Java catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: java/build.sh

  package:
    name: PKGBUILD
    runs-on: ubuntu-latest
    needs: [rust, python, java]
    steps:
      - uses: actions/checkout@v5

      - name: Shell scripts parse
        run: |
          for f in build.sh install.sh scripts/vm-test.sh scripts/make-data-iso.sh scripts/make-signing-key.sh java/build.sh; do
            bash -n "$f" || { echo "syntax error in $f"; exit 1; }
          done
          echo "all shell scripts parse"

      - name: PKGBUILD parses and sources cleanly
        run: |
          bash -n PKGBUILD || { echo "PKGBUILD has a syntax error"; exit 1; }
          # Sourcing it must define the functions without running them.
          ( set -euo pipefail; source PKGBUILD; declare -F build >/dev/null; declare -F package >/dev/null )
          echo "PKGBUILD defines build() and package()"

      - name: Build the source tarball the PKGBUILD expects
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "main" ] && version="$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)"
          name="camarelol-${version}"
          staging="${RUNNER_TEMP}/${name}"
          mkdir -p "$staging"
          for item in Cargo.toml Cargo.lock rust-toolchain.toml PKGBUILD LICENSE README.md \
                      core tui python java docs scripts keys .gitignore; do
            cp -r "$GITHUB_WORKSPACE/$item" "$staging/" 2>/dev/null || true
          done
          rm -rf "$staging"/target "$staging"/*/target "$staging"/java/out
          # Keep pkgver in step with the tarball name.
          sed -i "s/^pkgver=.*/pkgver=${version}/" "$staging/PKGBUILD"
          tar -czf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}" "$name"

      - name: makepkg the package in an Arch container
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "main" ] && version="$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)"
          # Docker ships with the GitHub runners; make sure the daemon is up.
          docker version >/dev/null 2>&1 || sudo systemctl start docker
          # Use a dedicated directory. Chowning RUNNER_TEMP itself breaks the
          # runner's own post-job cleanup.
          pkgdir="${RUNNER_TEMP}/pkgbuild"
          rm -rf "$pkgdir"
          mkdir -p "$pkgdir"
          cp "${RUNNER_TEMP}/camarelol-${version}.tar.gz" "$pkgdir/"
          tar -xzf "$pkgdir/camarelol-${version}.tar.gz" -C "$pkgdir"
          docker run --rm \
            -v "${pkgdir}:/build" \
            -w "/build" \
            archlinux:base-devel \
            bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed --disable-download-timeout
              pacman -S --noconfirm --needed rust cargo git
              # runtime deps declared by the PKGBUILD, so makepkg can resolve them
              pacman -S --noconfirm --needed util-linux gptfdisk arch-install-scripts
              # The tarball holds camarelol-<version>/; build inside it, the
              # way a user unpacks a release tarball and runs makepkg.
              srcdir="$(find /build -maxdepth 1 -type d -name "camarelol-*" | head -1)"
              echo "source dir: $srcdir"
              test -f "$srcdir/PKGBUILD"
              # makepkg looks for the source tarball next to the PKGBUILD.
              cp /build/camarelol-*.tar.gz "$srcdir/"
              # Run as a normal user, the way makepkg is meant to be used.
              useradd -m builder
              chown -R builder /build
              su builder -c "cd $srcdir && CARAMELOL_SKIP_TESTS=1 makepkg -s --noconfirm --skippgpcheck"
              echo "--- built package ---"
              ls -la "$srcdir"/*.pkg.tar.zst
              echo "--- contents ---"
              bsdtar -tf "$srcdir"/camarelol-*.pkg.tar.zst | sort
            '
          # The container wrote as root; hand the artifacts back to the runner
          # so the job can clean up after itself.
          sudo chown -R "$(id -u):$(id -g)" "$pkgdir"

  release:
    name: Release (tag only)
    needs: [rust, python, java]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build release binary
        run: cargo build --release --locked --manifest-path tui/Cargo.toml

      - name: Build the Java catalog jar
        run: java/build.sh

      - name: Create the source tarball
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="camarelol-${version}"
          staging="${RUNNER_TEMP}/${name}"
          mkdir -p "$staging"
          # Ship exactly what the PKGBUILD expects to find.
          for item in Cargo.toml Cargo.lock rust-toolchain.toml PKGBUILD LICENSE README.md \
                      core tui python java docs scripts keys .gitignore; do
            cp -r "$GITHUB_WORKSPACE/$item" "$staging/" 2>/dev/null || true
          done
          rm -rf "$staging"/target "$staging"/*/target "$staging"/java/out
          # The tarball is named after the tag; keep pkgver in step with it so
          # makepkg looks for the file we just produced.
          sed -i "s/^pkgver=.*/pkgver=${version}/" "$staging/PKGBUILD"
          tar -czf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}" "$name"
          echo "SHA256=$(sha256sum "${RUNNER_TEMP}/${name}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build the update index
        run: |
          set -euo pipefail
          # The index carries the checksum of the binary we just built, so the
          # updater can verify what it downloads. It is an asset, not a
          # silently published page: hosting it is a deliberate deployment step
          # and the URL is configurable with --update-url.
          sha="$(sha256sum target/release/camarelol | cut -d' ' -f1)"
          size="$(stat -c%s target/release/camarelol)"
          cat > latest.json <<EOF
          {
            "schema": 1,
            "version": "${VERSION}",
            "url": "https://github.com/tamkogay9876-code/camareLOL/releases/download/v${VERSION}/camarelol",
            "sha256": "${sha}",
            "size": ${size},
            "notes": "camareLOL ${VERSION}"
          }
          EOF
          # Fail the release rather than ship an index nothing can parse.
          python3 -c 'import json,sys; d=json.load(open("latest.json")); assert d["schema"]==1 and len(d["sha256"])==64'

          # Sign the index when a signing key is configured. Without one the
          # release still ships, but every camareLOL will refuse to install it
          # unless the user passes --allow-unsigned-update, which is the
          # honest outcome: an unsigned index proves nothing.
          # The length, never the value: an empty or whitespace-only secret is
          # indistinguishable from a missing one at the -n test, and the release
          # that results looks perfectly normal until every updater refuses it.
          echo "signing key length: ${#CAMARELOL_SIGNING_KEY}"
          if [ -n "${CAMARELOL_SIGNING_KEY:-}" ]; then
            printf '%s' "$CAMARELOL_SIGNING_KEY" > "$RUNNER_TEMP/signing.asc"
            chmod 600 "$RUNNER_TEMP/signing.asc"
            gpg --batch --quiet --import "$RUNNER_TEMP/signing.asc"
            # No second secret needed: with one key imported, that is the key.
            keyid="${CAMARELOL_SIGNING_KEY_ID:-}"
            if [ -z "$keyid" ]; then
              keyid="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec/{print $5; exit}')"
            fi
            if [ -z "$keyid" ]; then
              echo "::error::the signing secret contains no private key"
              exit 1
            fi
            # A passphrase-protected key needs loopback pinentry, otherwise
            # batch mode has no way to ask for it.
            sign_args=(--batch --yes --detach-sign --armor --local-user "$keyid")
            if [ -n "${CAMARELOL_SIGNING_PASSPHRASE:-}" ]; then
              sign_args+=(--pinentry-mode loopback --passphrase "$CAMARELOL_SIGNING_PASSPHRASE")
            fi
            gpg "${sign_args[@]}" -o latest.json.sig latest.json
            rm -f "$RUNNER_TEMP/signing.asc"
            gpg --batch --verify latest.json.sig latest.json
            echo "signed the update index"
          else
            # Failing beats warning. A warning here shipped v0.1.9 unsigned:
            # the release looked fine, and every camareLOL refused to install
            # it with no hint that the maintainer had simply not set the secret.
            echo "::error::CAMARELOL_SIGNING_KEY is missing or empty, so this release"
            echo "::error::would ship an unsigned update index that camareLOL refuses"
            echo "::error::to install. Set the secret and re-run the release job."
            echo "::error::To publish an unsigned release on purpose, replace this"
            echo "::error::check with:  exit 0"
            exit 1
          fi
          cat latest.json

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/camarelol-${{ env.VERSION }}.tar.gz
            target/release/camarelol
            java/out/camarelol-catalog.jar
            latest.json
            latest.json.sig
          generate_release_notes: true
          body: |
            ## camareLOL ${{ env.VERSION }}

            A modern, safety-first TUI installer for Arch Linux.

            ### Install

            Download the binary and run it from the Arch live ISO:

            ```console
            # chmod +x camarelol && ./camarelol --self-test
            # sudo ./camarelol
            ```

            Or from the tarball, which contains the `PKGBUILD` for a
            reproducible `makepkg` build.

            ### Warning

            Installing an operating system and partitioning disks can destroy
            data. camareLOL asks before every irreversible step and re-checks
            the disk identity immediately before writing.

            Source tarball SHA256: `${{ env.SHA256 }}`