name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  # Mirror health is worth watching even when nobody changed any code.
  schedule:
    - cron: "41 5 * * *"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (core + TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Binary smoke test
        run: |
          ./target/debug/camarelol --version
          ./target/debug/camarelol --scan > /dev/null
          ./target/debug/camarelol --self-test

  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because check_pkgbuild compares pkgver against
          # the newest tag. Without tags it found none and reported "matches" —
          # a check that passes because it could not look.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m unittest discover -s tests -v

      - name: The site
        # The renderer turns repository documentation into HTML. A bug here
        # publishes a broken page to the project's front door, so it is tested
        # against the real docs rather than only toy input.
        run: |
          python -m py_compile site/*.py
          python site/test_markdown.py
          python site/test_render_site.py
          # A reader clicking "English" must land on the English page. In the
          # Vietnamese table it landed back on Vietnamese, silently.
          python site/check_lang_table.py

      - name: The workflows themselves parse
        # A step with neither run: nor uses: is valid YAML and invalid to
        # GitHub, which then starts no job at all. The run reports failure
        # with no log to read, which is how a whole workflow went dark.
        run: |
          # PyYAML ships with the interpreter on a developer machine and not
          # on a runner. Installed here rather than assumed, which is the same
          # mistake in a different place.
          python -m pip install --quiet pyyaml
          python scripts/check_workflows.py

      - name: No secrets in the tree
        # .gitignore stops accidents. This catches the rest: a file added with
        # -f, a credential pasted into a file that is already tracked, a token
        # in a commit that is about to be pushed.
        run: |
          python scripts/check_secrets.py

      - name: The package recipe
        # PKGBUILD said 0.1.3 while the release was 0.1.10, and its source
        # pointed at a tarball that does not exist. Nothing notices that except
        # someone running makepkg.
        run: |
          python scripts/check_pkgbuild.py

  java:
    name: Java catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: java/build.sh

  package:
    name: PKGBUILD
    runs-on: ubuntu-latest
    needs: [rust, python, java, functions]
    steps:
      - uses: actions/checkout@v5

      - name: Shell scripts parse
        run: |
          for f in build.sh install.sh scripts/vm-test.sh scripts/make-data-iso.sh java/build.sh; do
            bash -n "$f" || { echo "syntax error in $f"; exit 1; }
          done
          echo "all shell scripts parse"

      - name: PKGBUILD parses and sources cleanly
        run: |
          bash -n PKGBUILD || { echo "PKGBUILD has a syntax error"; exit 1; }
          # Sourcing it must define the functions without running them.
          ( set -euo pipefail; source PKGBUILD; declare -F build >/dev/null; declare -F package >/dev/null )
          echo "PKGBUILD defines build() and package()"

      - name: Build the source tarball the PKGBUILD expects
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "main" ] && version="$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)"
          name="camarelol-${version}"
          staging="${RUNNER_TEMP}/${name}"
          mkdir -p "$staging"
          for item in Cargo.toml Cargo.lock rust-toolchain.toml PKGBUILD LICENSE README.md \
                      core tui python java docs scripts .gitignore; do
            cp -r "$GITHUB_WORKSPACE/$item" "$staging/" 2>/dev/null || true
          done
          rm -rf "$staging"/target "$staging"/*/target "$staging"/java/out
          find "$staging" -name '*.log' -delete
          # Keep pkgver in step with the tarball name.
          sed -i "s/^pkgver=.*/pkgver=${version}/" "$staging/PKGBUILD"
          tar -czf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}" "$name"
          # Pin the checksum of the tarball built here, the same way
          # make-release.sh pins the one it ships. Leaving the released hash in
          # place made every run fail the validity check against a tarball that
          # is not the released one — and 'SKIP' would have passed while checking
          # nothing.
          #
          # Written to its own file rather than into $staging: the tarball is
          # already built, so editing the copy inside it changes nothing that
          # makepkg will read. The next step copies this one over the extracted
          # PKGBUILD.
          sha="$(sha256sum "${RUNNER_TEMP}/${name}.tar.gz" | cut -d' ' -f1)"
          sed "s|^sha256sums=.*|sha256sums=('${sha}')|" "$staging/PKGBUILD" \
            > "${RUNNER_TEMP}/PKGBUILD.pinned"
          grep -E '^(pkgver|sha256sums)=' "${RUNNER_TEMP}/PKGBUILD.pinned"

      - name: makepkg the package in an Arch container
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "main" ] && version="$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)"
          # Docker ships with the GitHub runners; make sure the daemon is up.
          docker version >/dev/null 2>&1 || sudo systemctl start docker
          # Use a dedicated directory. Chowning RUNNER_TEMP itself breaks the
          # runner's own post-job cleanup.
          pkgdir="${RUNNER_TEMP}/pkgbuild"
          rm -rf "$pkgdir"
          mkdir -p "$pkgdir"
          cp "${RUNNER_TEMP}/camarelol-${version}.tar.gz" "$pkgdir/"
          cp "${RUNNER_TEMP}/PKGBUILD.pinned" "$pkgdir/PKGBUILD.pinned"
          tar -xzf "$pkgdir/camarelol-${version}.tar.gz" -C "$pkgdir"
          docker run --rm \
            -v "${pkgdir}:/build" \
            -w "/build" \
            archlinux:base-devel \
            bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed --disable-download-timeout
              pacman -S --noconfirm --needed rust cargo git
              # runtime deps declared by the PKGBUILD, so makepkg can resolve them
              pacman -S --noconfirm --needed util-linux gptfdisk arch-install-scripts
              # The tarball holds camarelol-<version>/; build inside it, the
              # way a user unpacks a release tarball and runs makepkg.
              srcdir="$(find /build -maxdepth 1 -type d -name "camarelol-*" | head -1)"
              echo "source dir: $srcdir"
              test -f "$srcdir/PKGBUILD"
              # The recipe that carries this tarball s own checksum. The copy
              # inside the tarball cannot: it was sealed before the checksum was
              # known, so it still holds the released one and makepkg rejects
              # every build as corrupt.
              cp /build/PKGBUILD.pinned "$srcdir/PKGBUILD"
              # makepkg looks for the source tarball next to the PKGBUILD.
              cp /build/camarelol-*.tar.gz "$srcdir/"
              # Run as a normal user, the way makepkg is meant to be used.
              useradd -m builder
              chown -R builder /build
              su builder -c "cd $srcdir && CARAMELOL_SKIP_TESTS=1 makepkg -s --noconfirm --skippgpcheck"
              echo "--- built package ---"
              ls -la "$srcdir"/*.pkg.tar.zst
              echo "--- contents ---"
              bsdtar -tf "$srcdir"/camarelol-*.pkg.tar.zst | sort
            '
          # The container wrote as root; hand the artifacts back to the runner
          # so the job can clean up after itself.
          sudo chown -R "$(id -u):$(id -g)" "$pkgdir"


  functions:
    name: Netlify functions
    # The login flow cannot be exercised on a developer machine here — there is
    # no Node runtime and no Google client — so CI is the only place the session
    # signing is ever tested. A cookie that fails to reject a forged one turns
    # into "everyone is logged in", and that is not a bug this finds in review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Every function parses
        run: |
          set -euo pipefail
          for f in site/functions/*.js; do
            node --check "$f" || { echo "::error::$f does not parse"; exit 1; }
            printf '  ok %s\n' "$f"
          done

      - name: A forged session is refused
        run: node site/test_functions.mjs

