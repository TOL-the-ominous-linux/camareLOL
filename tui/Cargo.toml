[package]
name = "camarelol"
description = "camareLOL — a modern, safety-first TUI installer for Arch Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "camarelol"

[[bin]]
name = "camarelol"
path = "src/main.rs"

[dependencies]
camarelol-core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
